name: Deploy to GitHub Pages

# Автосборка и публикация сайта при каждом обновлении кода в ветке main
on:
  push:
    branches: [main]
  workflow_dispatch: # + кнопка «Run workflow» на вкладке Actions

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Скачать код
        uses: actions/checkout@v4

      - name: Установить Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Установить зависимости
        run: bun install --frozen-lockfile

      - name: Собрать сайт
        run: bun run build
        env:
          # Путь сайта = имя репозитория (меняется автоматически)
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}

      - name: Настроить GitHub Pages
        uses: actions/configure-pages@v5

      - name: Упаковать собранный сайт
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Опубликовать сайт
        id: deployment
        uses: actions/deploy-pages@v4
